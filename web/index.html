<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Central de Cortes</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
  <aside class="side">
    <div class="brand"><img src="/logo.svg" alt="" />Central de Cortes</div>
    <button class="btn primary side-new" id="side-new" type="button">＋ Novo vídeo</button>
    <nav class="tabs" role="tablist">
      <button data-tab="home" class="active"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>Início</button>
      <button data-tab="studio"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>Estúdio <span class="pill" id="pending-count">0</span></button>
      <button data-tab="pipeline"><svg viewBox="0 0 24 24"><path d="M4 5h4v14H4zM10 5h4v9h-4zM16 5h4v6h-4z"/></svg>Fila</button>
      <button data-tab="channels"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>Configurações</button>
      <button data-tab="costs"><svg viewBox="0 0 24 24"><path d="M5 19V9M12 19V5M19 19v-7"/></svg>Custos</button>
    </nav>
    <div class="side-label">Canais</div>
    <ul id="side-channels"></ul>
    <div class="side-foot"><span id="worker-status" class="worker off"><i></i>worker</span></div>
  </aside>

  <main>
    <!-- INÍCIO (um por canal) -->
    <section id="tab-home" class="tab active">
      <div class="hero">
        <h1 id="home-hello">Olá</h1>
        <p class="muted" id="home-sub"></p>
        <form id="new-job" class="composer">
          <textarea name="source" rows="1" placeholder="Cole um link do YouTube (vários? um por linha)" required></textarea>
          <div class="composer-bar">
            <select name="channel_id" aria-label="Canal" required></select>
            <select name="template_id" aria-label="Modelo de corte" title="Modelo de corte"></select>
            <button class="send" type="submit" title="Processar" aria-label="Processar"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
          </div>
        </form>
        <div class="stats" id="home-stats"></div>
      </div>
      <div id="home-body"></div>
      <div id="failures"></div>
    </section>

    <!-- FILA (kanban) -->
    <section id="tab-pipeline" class="tab">
      <div class="kchips" id="kchips"></div>
      <div class="kanban" id="kanban"></div>
    </section>

    <!-- ESTÚDIO -->
    <section id="tab-studio" class="tab">
      <div class="studio">
        <aside class="studio-list">
          <div class="seg" id="studio-filter">
            <button data-f="PENDING_REVIEW" class="active">Pendentes</button>
            <button data-f="SCHEDULED">Agenda</button>
            <button data-f="PUBLISHED">Publicados</button>
            <button data-f="ALL">Todos</button>
          </div>
          <div id="studio-batch"></div>
          <ul id="clip-list"></ul>
        </aside>
        <div class="studio-main" id="studio-main">
          <p class="empty">Selecione um corte para revisar.</p>
        </div>
      </div>
    </section>

    <!-- CANAIS -->
    <section id="tab-channels" class="tab">
      <div class="channels">
        <aside>
          <ul id="channel-list"></ul>
          <button class="btn" id="new-channel">+ Novo canal</button>
          <div id="pv-channel-wrap" class="pv-side"></div>
        </aside>
        <div class="channel-main">
          <section id="integrations" class="card"></section>
          <section id="brand" class="card"></section>
          <section id="templates" class="card"></section>
          <form id="channel-form" class="card form"></form>
        </div>
      </div>
    </section>

    <!-- CUSTOS -->
    <section id="tab-costs" class="tab">
      <div id="costs"></div>
    </section>
  </main>
  </div>

  <dialog id="new-channel-dialog">
    <form method="dialog" class="form">
      <h3>Novo canal</h3>
      <label class="full">Nome do canal <input name="name" required placeholder="ex.: Última Rep"></label>
      <label class="full">ID interno <input name="id" required pattern="[a-z0-9_]+" placeholder="gerado a partir do nome"></label>
      <label class="full">Sobre o que é o canal <textarea name="niche" rows="2" placeholder="nicho, público e o que entra nos cortes"></textarea></label>
      <label class="full">Tom de voz <textarea name="tone" rows="2" placeholder="como os títulos e legendas devem soar"></textarea></label>
      <label>Horários de postagem <input name="schedule_slots" value="12:00,18:30" placeholder="HH:MM, separados por vírgula"></label>
      <label>Títulos <select name="title_style"><option value="sentence">Caixa normal</option><option value="upper">CAIXA ALTA</option></select></label>
      <div class="full checks"><label><input type="checkbox" name="t_youtube" checked> ▶ YouTube</label><label><input type="checkbox" name="t_tiktok" checked> ♪ TikTok</label></div>
      <div class="full muted" style="font-size:12px">O canal nasce com modelos de corte prontos. Depois é só conectar as contas e, se quiser, ajustar a identidade visual.</div>
      <div class="full actions"><button class="btn primary" type="submit">Criar canal</button><button class="btn" value="cancel" formnovalidate>Cancelar</button></div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
