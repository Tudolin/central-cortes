<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Central de Cortes</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="brand-mark"></span>CORTES<span class="brand-slash">//</span>CENTRAL</div>
    <nav class="tabs" role="tablist">
      <button data-tab="pipeline" class="active">Pipeline</button>
      <button data-tab="studio">Estúdio <span class="pill" id="pending-count">0</span></button>
      <button data-tab="channels">Canais</button>
      <button data-tab="costs">Custos</button>
    </nav>
    <span id="worker-status" class="worker off"><i></i>worker</span>
    <select id="channel-filter" aria-label="Filtrar canal"></select>
  </header>

  <main>
    <!-- PIPELINE -->
    <section id="tab-pipeline" class="tab active">
      <form id="new-job" class="new-job">
        <select name="channel_id" aria-label="Canal" required></select>
        <textarea name="source" rows="1" placeholder="URL do YouTube (ou caminho de arquivo no servidor). Várias? Uma por linha." required></textarea>
        <button class="btn primary" type="submit">Processar</button>
      </form>
      <div class="kanban" id="kanban"></div>
      <div id="failures"></div>
    </section>

    <!-- ESTÚDIO -->
    <section id="tab-studio" class="tab">
      <div class="studio">
        <aside class="studio-list">
          <div class="seg" id="studio-filter">
            <button data-f="PENDING_REVIEW" class="active">Pendentes</button>
            <button data-f="SCHEDULED">Agenda</button>
            <button data-f="PUBLISHED">Publicados</button>
            <button data-f="ALL">Todos</button>
          </div>
          <ul id="clip-list"></ul>
        </aside>
        <div class="studio-main" id="studio-main">
          <p class="empty">Selecione um corte para revisar.</p>
        </div>
      </div>
    </section>

    <!-- CANAIS -->
    <section id="tab-channels" class="tab">
      <div class="channels">
        <aside>
          <ul id="channel-list"></ul>
          <button class="btn" id="new-channel">+ Novo canal</button>
        </aside>
        <div class="channel-main">
          <section id="integrations" class="card"></section>
          <form id="channel-form" class="card form"></form>
        </div>
      </div>
    </section>

    <!-- CUSTOS -->
    <section id="tab-costs" class="tab">
      <div id="costs"></div>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
