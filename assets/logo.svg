<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Central de Cortes: um vídeo vertical (9:16) "cortado" na diagonal, com a faixa de título vermelha,
       o play e a legenda com palavra em destaque — os elementos do próprio produto. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1c1c20"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".2" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".8" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="top"><polygon points="0,0 1024,0 1024,560.7 0,740.4"/></clipPath>
    <clipPath id="bottom"><polygon points="0,740.4 1024,560.7 1024,1024 0,1024"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55"/>
    </filter>

    <g id="card">
      <g transform="rotate(-6 512 512)">
        <rect x="302" y="139" width="420" height="746" rx="56" fill="#FFD700"/>
        <!-- faixa de título com borda de pincel -->
        <g transform="rotate(2 512 292)">
          <path fill="#D7161E" d="M334 246 L372 240 L410 247 L452 241 L494 248 L536 240 L578 247 L620 241 L662 248 L692 243
                                  L697 270 L691 298 L698 326 L690 344 L652 338 L610 345 L568 338 L526 346 L484 339 L442 345
                                  L400 338 L358 344 L328 339 L333 312 L326 284 L332 262 Z"/>
          <rect x="390" y="266" width="244" height="22" rx="11" fill="#FFE600"/>
          <rect x="430" y="302" width="164" height="22" rx="11" fill="#FFE600"/>
        </g>
        <!-- play -->
        <path d="M466 506 L466 664 Q466 682 482 673 L602 603 Q618 594 602 585 L482 515 Q466 506 466 506 Z" fill="#0B0B0C"/>
        <!-- legenda: palavra falada em destaque -->
        <rect x="352" y="752" width="320" height="56" rx="28" fill="#0B0B0C"/>
        <rect x="378" y="772" width="112" height="16" rx="8" fill="#FFFFFF"/>
        <rect x="504" y="772" width="142" height="16" rx="8" fill="#FFD700"/>
      </g>
    </g>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g transform="translate(-17 -26)">
  <g filter="url(#shadow)">
    <g clip-path="url(#top)"><use href="#card"/></g>
    <g transform="translate(34 52)"><g clip-path="url(#bottom)"><use href="#card"/></g></g>
  </g>

  <!-- lâmina do corte -->
  <line x1="187" y1="736.5" x2="887" y2="613.7" stroke="url(#blade)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
